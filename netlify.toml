[build]
  command = "npm run build"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "@netlify/blobs", "groq-sdk", "pg"]
  included_files = ["server/config/**"]


[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[context.production.environment]
  NODE_ENV = "production"
  LLM_PROVIDER = "groq"
  GROQ_MODEL = "openai/gpt-oss-20b"
  REDACT_BEFORE_LLM = "true"
